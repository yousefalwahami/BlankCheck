name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @blankcheck/shared test
      - run: pnpm --filter @blankcheck/server test
      - run: pnpm --filter @blankcheck/web build
      # The C referee against the real Thru SDK headers + SHA-256: vectors and a replayed game
      - run: make -C programs/referee/test
